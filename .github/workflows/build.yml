name: Build SnakeProxy APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Find project (unzip SnakeProxy.zip if uploaded)
        run: |
          if [ -f SnakeProxy.zip ]; then
            rm -rf build_src && mkdir build_src
            unzip -q -o SnakeProxy.zip -d build_src
          fi
          if [ -f build_src/SnakeProxy/settings.gradle.kts ]; then
            echo "PROJ=build_src/SnakeProxy" >> $GITHUB_ENV
          elif [ -f SnakeProxy/settings.gradle.kts ]; then
            echo "PROJ=SnakeProxy" >> $GITHUB_ENV
          else
            echo "PROJ=." >> $GITHUB_ENV
          fi

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Check Android SDK
        id: sdk
        run: |
          SDK="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          if [ -n "$SDK" ] && [ -d "$SDK/platforms" ]; then
            echo "Android SDK found: $SDK"
            echo "sdk.dir=$SDK" > "$PROJ/local.properties"
            echo "found=yes" >> $GITHUB_OUTPUT
          else
            echo "found=no" >> $GITHUB_OUTPUT
          fi

      - name: Install Android SDK (only if missing)
        if: steps.sdk.outputs.found != 'yes'
        uses: android-actions/setup-android@v3

      - name: Download proxy engine (hev-socks5-tunnel)
        run: |
          J="$PROJ/app/src/main/jni/hev-socks5-tunnel"
          rm -rf "$J"
          git clone --depth 1 --recursive --shallow-submodules https://github.com/heiher/hev-socks5-tunnel "$J"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build APK
        timeout-minutes: 20
        run: |
          cd "$PROJ"
          set +e
          set -o pipefail
          gradle assembleDebug --console=plain --no-daemon 2>&1 | tee "$GITHUB_WORKSPACE/gradle.log"
          CODE=$?
          set -e
          if [ $CODE -ne 0 ]; then
            echo ""
            echo "=================== ERROR SUMMARY (screenshot this) ==================="
            grep -nE "^e: |error:|Error:|What went wrong|Execution failed|Could not|not found|Unresolved" "$GITHUB_WORKSPACE/gradle.log" | head -n 40
            exit 1
          fi
          cp app/build/outputs/apk/debug/app-debug.apk "$GITHUB_WORKSPACE/SnakeProxy.apk"

      - name: Upload APK (artifact)
        uses: actions/upload-artifact@v4
        with:
          name: SnakeProxy-apk
          path: SnakeProxy.apk

      - name: Publish APK (Releases)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: SnakeProxy build ${{ github.run_number }}
          files: SnakeProxy.apk
          
